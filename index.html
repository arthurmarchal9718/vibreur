<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibration Music Pro</title>
  <link rel="icon" type="image/png" href="https://cdn3d.iconscout.com/3d/free/thumb/free-spotify-3d-icon-png-download-7250510.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #1DB954;
      --green-bright: #1ed760;
      --green-dim: rgba(29,185,84,0.12);
      --green-glow: rgba(29,185,84,0.25);
      --black: #000000;
      --dark: #0a0a0a;
      --card: #111111;
      --surface: #181818;
      --border: #222222;
      --text: #ffffff;
      --muted: #b3b3b3;
      --faint: #444444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Background noise texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Ambient glow orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(29,185,84,0.07);
      top: -100px; left: -100px;
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: rgba(29,185,84,0.05);
      bottom: -80px; right: -80px;
      animation: drift2 14s ease-in-out infinite alternate;
    }

    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(60px, 40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-40px, -60px); } }

    /* ── Main layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 24px 20px;
    }

    /* ── Top brand bar ── */
    .brand-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      padding-left: 4px;
    }

    .brand-logo {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo svg {
      width: 18px; height: 18px;
      fill: #000;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-tag {
      margin-left: auto;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--green);
      background: var(--green-dim);
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 24px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    .card-inner {
      padding: 36px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Card top glow ── */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green-glow), transparent);
    }

    /* ── Icon ring ── */
    .icon-ring {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      box-shadow:
        0 0 0 10px rgba(29,185,84,0.10),
        0 0 0 20px rgba(29,185,84,0.05);
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 10px rgba(29,185,84,0.10), 0 0 0 20px rgba(29,185,84,0.05); }
      50% { box-shadow: 0 0 0 14px rgba(29,185,84,0.14), 0 0 0 28px rgba(29,185,84,0.06); }
    }

    .icon-ring svg {
      width: 40px; height: 40px;
      fill: #000;
    }

    /* ── Headline ── */
    .headline {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .headline .accent {
      color: var(--green);
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 32px;
    }

    /* ── Equalizer bars ── */
    .eq-wrap {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 36px;
      margin-bottom: 32px;
    }

    .eq-bar {
      width: 5px;
      border-radius: 3px;
      background: var(--green);
      transition: height 0.1s;
    }

    .eq-bar:nth-child(1)  { animation: eq 1.1s 0.0s ease-in-out infinite alternate; opacity: 0.4; }
    .eq-bar:nth-child(2)  { animation: eq 0.9s 0.1s ease-in-out infinite alternate; opacity: 0.6; }
    .eq-bar:nth-child(3)  { animation: eq 0.7s 0.2s ease-in-out infinite alternate; opacity: 0.9; }
    .eq-bar:nth-child(4)  { animation: eq 1.3s 0.0s ease-in-out infinite alternate; opacity: 1;   }
    .eq-bar:nth-child(5)  { animation: eq 0.8s 0.15s ease-in-out infinite alternate; opacity: 0.9; }
    .eq-bar:nth-child(6)  { animation: eq 1.0s 0.05s ease-in-out infinite alternate; opacity: 0.6; }
    .eq-bar:nth-child(7)  { animation: eq 0.85s 0.2s ease-in-out infinite alternate; opacity: 0.4; }

    @keyframes eq {
      from { height: 6px; }
      to   { height: 36px; }
    }

    /* ── Drop zone ── */
    .drop-zone {
      width: 100%;
      background: var(--surface);
      border: 1.5px dashed var(--faint);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }

    .drop-zone:hover,
    .drop-zone.has-file {
      border-color: var(--green);
      background: rgba(29,185,84,0.04);
    }

    .drop-icon {
      width: 44px; height: 44px;
      background: var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-icon svg {
      width: 22px; height: 22px;
      stroke: var(--green);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drop-label {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    .drop-label strong {
      color: var(--green);
      font-weight: 700;
    }

    .drop-hint {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--faint);
      letter-spacing: 0.5px;
    }

    .drop-file-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }

    .drop-file-name.visible { display: block; }

    input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* ── Play button ── */
    .play-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 50px;
      background: var(--green);
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .play-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      border-radius: 50px;
      pointer-events: none;
    }

    .play-btn:hover {
      background: var(--green-bright);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(29,185,84,0.35);
    }

    .play-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: none;
    }

    .play-btn svg {
      width: 20px; height: 20px;
      fill: #000;
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .status-bar {
      width: 100%;
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.live {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(29,185,84,0.2);
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--faint);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* ── Footer ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #0d0d0d;
      border-top: 1px solid var(--border);
    }

    .footer-tip {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.3px;
    }

    .footer-tip span {
      color: var(--green);
      font-weight: 600;
    }

    .footer-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--faint);
      letter-spacing: 1px;
    }

    .footer-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.6;
    }

    /* ── Vibration ripple overlay ── */
    .ripple-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    .ripple-container.active { display: block; }

    .ripple-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(29,185,84,0.3);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleOut 1.4s ease-out infinite;
    }

    .ripple-ring:nth-child(2) { animation-delay: 0.4s; }
    .ripple-ring:nth-child(3) { animation-delay: 0.8s; }

    @keyframes rippleOut {
      0%   { width: 100px; height: 100px; opacity: 0.7; transform: translate(-50%, -50%) scale(0); }
      100% { width: 600px; height: 600px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* ── Page footer ── */
    .page-foot {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--faint);
      letter-spacing: 1.5px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Ripple overlay when playing -->
  <div class="ripple-container" id="rippleContainer">
    <div class="ripple-ring"></div>
    <div class="ripple-ring"></div>
    <div class="ripple-ring"></div>
  </div>

  <div class="wrapper">

    <!-- Brand bar -->
    <div class="brand-bar">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.42c-.2.32-.62.42-.94.22-2.58-1.58-5.82-1.93-9.65-1.06-.37.09-.74-.14-.83-.51-.09-.37.14-.74.51-.83 4.18-.96 7.77-.55 10.69 1.24.32.2.42.62.22.94zm1.24-2.77c-.25.4-.78.52-1.18.27-2.95-1.81-7.45-2.34-10.93-1.28-.46.14-.94-.12-1.08-.58s.12-.94.58-1.08c3.98-1.21 8.93-.62 12.34 1.49.4.25.52.78.27 1.18zm.11-2.89c-3.54-2.1-9.37-2.29-12.74-1.27-.54.16-1.11-.14-1.27-.68s.14-1.11.68-1.27c3.87-1.17 10.31-.95 14.37 1.47.48.28.64.9.35 1.38-.28.47-.9.63-1.39.37z"/></svg>
      </div>
      <div class="brand-name">Vibration Music</div>
      <div class="brand-tag">PRO</div>
    </div>

    <!-- Main card -->
    <div class="card">
      <div class="card-inner">

        <!-- Logo -->
        <div class="icon-ring">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.42c-.2.32-.62.42-.94.22-2.58-1.58-5.82-1.93-9.65-1.06-.37.09-.74-.14-.83-.51-.09-.37.14-.74.51-.83 4.18-.96 7.77-.55 10.69 1.24.32.2.42.62.22.94zm1.24-2.77c-.25.4-.78.52-1.18.27-2.95-1.81-7.45-2.34-10.93-1.28-.46.14-.94-.12-1.08-.58s.12-.94.58-1.08c3.98-1.21 8.93-.62 12.34 1.49.4.25.52.78.27 1.18zm.11-2.89c-3.54-2.1-9.37-2.29-12.74-1.27-.54.16-1.11-.14-1.27-.68s.14-1.11.68-1.27c3.87-1.17 10.31-.95 14.37 1.47.48.28.64.9.35 1.38-.28.47-.9.63-1.39.37z"/></svg>
        </div>

        <!-- Headline -->
        <h1 class="headline">Tes basses,<br><span class="accent">ta vibration.</span></h1>
        <p class="sub">Lance ta musique MP3 et ressens chaque basse directement dans ton téléphone.</p>

        <!-- Equalizer -->
        <div class="eq-wrap" id="eqWrap">
          <div class="eq-bar" style="height:10px"></div>
          <div class="eq-bar" style="height:20px"></div>
          <div class="eq-bar" style="height:30px"></div>
          <div class="eq-bar" style="height:36px"></div>
          <div class="eq-bar" style="height:28px"></div>
          <div class="eq-bar" style="height:18px"></div>
          <div class="eq-bar" style="height:10px"></div>
        </div>

        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          </div>
          <div class="drop-label"><strong>Choisir un fichier</strong> ou glisser ici</div>
          <div class="drop-hint">MP3 · WAV · OGG</div>
          <div class="drop-file-name" id="dropFileName">—</div>
          <input type="file" id="fileInput" accept="audio/*">
        </div>

        <!-- Play button -->
        <button class="play-btn" id="playBtn">
          <svg id="btnIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="btnText">Lire &amp; Vibrer</span>
        </button>

        <!-- Status bar -->
        <div class="status-bar">
          <div class="status-dot" id="statusDot"></div>
          <div class="status-label">Statut</div>
          <div class="status-text" id="statusText">En attente d'un fichier…</div>
        </div>

      </div>

      <!-- Card footer -->
      <div class="card-footer">
        <div class="footer-tip">Fonctionne avec <span>Vibration API</span></div>
        <div class="footer-badge">Bass-Sync v1.0</div>
      </div>
    </div>

    <div class="page-foot">VIBRATION MUSIC PRO &nbsp;·&nbsp; 2025</div>
  </div>

  <audio id="audio" style="display:none;"></audio>

  <script>
    const fileInput       = document.getElementById('fileInput');
    const playBtn         = document.getElementById('playBtn');
    const audio           = document.getElementById('audio');
    const statusText      = document.getElementById('statusText');
    const statusDot       = document.getElementById('statusDot');
    const dropZone        = document.getElementById('dropZone');
    const dropFileName    = document.getElementById('dropFileName');
    const btnIcon         = document.getElementById('btnIcon');
    const btnText         = document.getElementById('btnText');
    const rippleContainer = document.getElementById('rippleContainer');

    let audioContext, analyser, dataArray, sourceNode, vibrationInterval;
    let isPlaying = false;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        dropFileName.textContent = file.name;
        dropFileName.classList.add('visible');
        dropZone.classList.add('has-file');
        statusText.textContent = 'Prêt à lire.';
      }
    });

    function canVibrate() { return 'vibrate' in navigator; }

    function getBassLevel(arr) {
      let sum = 0;
      for (let i = 0; i < 40; i++) sum += arr[i];
      return sum / 40;
    }

    function startVibrationLoop() {
      if (!canVibrate()) {
        statusText.textContent = 'Vibration non supportée.';
        return;
      }
      vibrationInterval = setInterval(() => {
        analyser.getByteFrequencyData(dataArray);
        const bass = getBassLevel(dataArray);
        if (bass > 120) navigator.vibrate(100);
      }, 120);
    }

    function stopVibrationLoop() {
      clearInterval(vibrationInterval);
      if (canVibrate()) navigator.vibrate(0);
    }

    function setPlaying(playing) {
      isPlaying = playing;
      if (playing) {
        btnIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btnText.textContent = 'Arrêter';
        statusText.textContent = 'Lecture + vibrations en cours…';
        statusDot.classList.add('live');
        rippleContainer.classList.add('active');
      } else {
        btnIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btnText.textContent = 'Lire & Vibrer';
        statusDot.classList.remove('live');
        rippleContainer.classList.remove('active');
      }
    }

    playBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { alert('Choisis un fichier audio.'); return; }

      if (!isPlaying) {
        const url = URL.createObjectURL(file);
        audio.src = url;
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (sourceNode) sourceNode.disconnect();
        sourceNode = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
        if (audioContext.state === 'suspended') await audioContext.resume();
        audio.play();
        setPlaying(true);
        startVibrationLoop();
      } else {
        audio.pause();
        audio.currentTime = 0;
        setPlaying(false);
        statusText.textContent = 'En pause.';
        stopVibrationLoop();
      }
    });

    audio.addEventListener('ended', () => {
      setPlaying(false);
      statusText.textContent = 'Lecture terminée.';
      stopVibrationLoop();
    });
  </script>
</body>
</html>
